name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - main-lite-branch
      - 'releases/*'

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2024.2
        with:
          linter: jetbrains/qodana-python:2024.2
          pr-mode: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_182572224 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
